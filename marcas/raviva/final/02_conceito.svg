<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <rect width="1600" height="2000" fill="#FCF8F1"/>
  
        <line x1="130" y1="86" x2="1470" y2="86" stroke="#E2A98C" stroke-width="1.5"/>
        <text x="130" y="66" font-family="DM Mono" font-size="18" fill="#6b5645" letter-spacing="3">RAVIVA — MANUAL DE MARCA</text>
        <text x="1470" y="66" font-family="DM Mono" font-size="18" fill="#6b5645" text-anchor="end" letter-spacing="3">01 — CONCEITO</text>
        
  <text x="130" y="270" font-family="Poiret One" font-size="72" fill="#3A2317" letter-spacing="4">O conceito</text><text x="130" y="400" font-family="Outfit" font-weight="700" font-size="46" fill="#C9491F" text-anchor="start" letter-spacing="2">FOGO É SOL ESTOCADO.</text><text x="130" y="532" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">Toda chama que acendemos já foi, um dia, luz</text>
<text x="130" y="582" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">solar. A planta a captura por fotossíntese e</text>
<text x="130" y="632" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">a guarda, célula a célula, na madeira —</text>
<text x="130" y="682" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">esperando o momento de virar calor outra</text>
<text x="130" y="732" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">vez. Cada anel de crescimento de uma árvore</text>
<text x="130" y="782" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">é um ano inteiro de sol condensado.</text><text x="130" y="892" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">A Raviva nasce desse princípio: energia que</text>
<text x="130" y="942" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">nunca se perde, apenas se transforma e</text>
<text x="130" y="992" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">espera. O nome carrega essa ideia escondida</text>
<text x="130" y="1042" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">— ‘ravi’ é sol em sânscrito, e vive dentro</text>
<text x="130" y="1092" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">do verbo português avivar: reacender, atiçar</text>
<text x="130" y="1142" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">a chama. Raviva é, ao mesmo tempo, a ação de</text>
<text x="130" y="1192" font-family="Outfit" font-weight="400" font-size="30" fill="#3A2317" text-anchor="start" letter-spacing="0">reacender e o sol escondido dentro dela.</text><text x="130" y="1332" font-family="Poiret One" font-size="54" fill="#C9491F" letter-spacing="2">Por isso: acenda a faísca.</text>
  
    <line x1="130" y1="1930" x2="1470" y2="1930" stroke="#E2A98C" stroke-width="1.5" opacity="0.6"/>
    <text x="1470" y="1960" font-family="DM Mono" font-size="18" fill="#6b5645" text-anchor="end" letter-spacing="2">02</text>
    <text x="130" y="1960" font-family="DM Mono" font-size="18" fill="#6b5645" letter-spacing="2">ACENDA A FAÍSCA</text>
    
</svg>