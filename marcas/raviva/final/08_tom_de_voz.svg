<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <rect width="1600" height="2000" fill="#FCF8F1"/>
  
        <line x1="130" y1="86" x2="1470" y2="86" stroke="#E2A98C" stroke-width="1.5"/>
        <text x="130" y="66" font-family="DM Mono" font-size="18" fill="#6b5645" letter-spacing="3">RAVIVA — MANUAL DE MARCA</text>
        <text x="1470" y="66" font-family="DM Mono" font-size="18" fill="#6b5645" text-anchor="end" letter-spacing="3">07 — VOZ</text>
        
  <text x="130" y="230" font-family="Poiret One" font-size="64" fill="#3A2317" letter-spacing="4">Tom de voz</text><text x="130" y="285" font-family="Outfit" font-weight="400" font-size="24" fill="#6b5645" text-anchor="start" letter-spacing="0">Como a Raviva soa em texto — de embalagem a atendimento.</text><circle cx="144" cy="410" r="6" fill="#C9491F"/><text x="180" y="420" font-family="DM Mono" font-size="24" fill="#3A2317" letter-spacing="2">DIRETO</text><text x="180" y="464" font-family="Outfit" font-weight="400" font-size="26" fill="#6b5645" text-anchor="start" letter-spacing="0">Frases curtas, sem jargão corporativo de energia.</text><text x="180" y="520" font-family="Poiret One" font-size="34" fill="#C9491F">“Fogo é sol guardado.”</text><circle cx="144" cy="640" r="6" fill="#C9491F"/><text x="180" y="650" font-family="DM Mono" font-size="24" fill="#3A2317" letter-spacing="2">QUENTE, NÃO INSTITUCIONAL</text><text x="180" y="694" font-family="Outfit" font-weight="400" font-size="26" fill="#6b5645" text-anchor="start" letter-spacing="0">Fala como quem cuida do fogo, não como uma concessionária.</text><text x="180" y="750" font-family="Poiret One" font-size="34" fill="#C9491F">“Acenda a faísca.”</text><circle cx="144" cy="870" r="6" fill="#C9491F"/><text x="180" y="880" font-family="DM Mono" font-size="24" fill="#3A2317" letter-spacing="2">DEIXA A METÁFORA RESPIRAR</text><text x="180" y="924" font-family="Outfit" font-weight="400" font-size="26" fill="#6b5645" text-anchor="start" letter-spacing="0">Não explica demais — confia que a imagem já comunica.</text><text x="180" y="980" font-family="Poiret One" font-size="34" fill="#C9491F">“Cada anel, um ano de sol.”</text><circle cx="144" cy="1100" r="6" fill="#C9491F"/><text x="180" y="1110" font-family="DM Mono" font-size="24" fill="#3A2317" letter-spacing="2">ORGULHO TÉCNICO DISCRETO</text><text x="180" y="1154" font-family="Outfit" font-weight="400" font-size="26" fill="#6b5645" text-anchor="start" letter-spacing="0">Ao falar de processo, usa tom de caderno de campo, não de</text>
<text x="180" y="1190" font-family="Outfit" font-weight="400" font-size="26" fill="#6b5645" text-anchor="start" letter-spacing="0">folheto.</text><text x="180" y="1246" font-family="Poiret One" font-size="34" fill="#C9491F">“Amostra 01 — sol guardado.”</text>
  
    <line x1="130" y1="1930" x2="1470" y2="1930" stroke="#E2A98C" stroke-width="1.5" opacity="0.6"/>
    <text x="1470" y="1960" font-family="DM Mono" font-size="18" fill="#6b5645" text-anchor="end" letter-spacing="2">08</text>
    <text x="130" y="1960" font-family="DM Mono" font-size="18" fill="#6b5645" letter-spacing="2">ACENDA A FAÍSCA</text>
    
</svg>